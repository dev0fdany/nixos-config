# home/matugen/mako.ini
# --- Positioning ---
anchor=top-right
margin=20

# --- Pill Shape Layout ---
width=350
height=100
border-radius=10
border-size=2
padding=15

# --- Dynamic Palette Generation (Enforces 100% Solid Opacity via 'ff') ---
background-color={{colors.surface.default.hex}}ff
border-color={{colors.primary.default.hex}}ff
text-color={{colors.on_surface.default.hex}}ff

# --- Font & Text Formatting ---
font=sans-serif 11
text-alignment=left

# --- Behavior ---
default-timeout=5000
ignore-timeout=0

# --- Sound Notification ---
on-notify=exec mpv /etc/nixos/home/mako/notification-generic.wav

# --- Dynamic High-Priority Alert Profiles ---
[urgency=high]
border-color={{colors.error.default.hex}}ff
text-color={{colors.error.default.hex}}ff
